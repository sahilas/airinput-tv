<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f13">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>airInput — Controller</title>

  <link rel="stylesheet" href="global.css">
  <link id="skin-style" rel="stylesheet" href="">

  <script src="nipplejs.min.js"></script>
</head>

<body>

  <!-- ---------- join ---------- -->
  <div id="join-screen">
    <div class="join-card">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>airInput</h1>
      </div>
      <p class="brand-sub">Turn this phone into a controller</p>

      <label class="field-label" for="username-input">Player name</label>
      <input type="text" id="username-input" placeholder="e.g. Alex" autocomplete="off"
        autocapitalize="words" spellcheck="false" maxlength="24" enterkeyhint="go" />

      <button id="join-btn" class="primary-btn">
        <span class="btn-label">Connect</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>

      <div id="conn-status" class="conn-status" data-state="connecting">
        <span class="dot" aria-hidden="true"></span>
        <span class="conn-text">Connecting to TV…</span>
      </div>
    </div>
  </div>

  <!-- ---------- in-game chrome ---------- -->
  <button id="btn-settings" aria-label="Settings" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5Zm7.4-2.2a7.6 7.6 0 0 0 0-2.6l2-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-2.3-1.3L14.4 3H9.6l-.4 2.4a7.6 7.6 0 0 0-2.3 1.3l-2.3-.9-2 3.4 2 1.5a7.6 7.6 0 0 0 0 2.6l-2 1.5 2 3.4 2.3-.9a7.6 7.6 0 0 0 2.3 1.3l.4 2.4h4.8l.4-2.4a7.6 7.6 0 0 0 2.3-1.3l2.3.9 2-3.4Z" />
    </svg>
  </button>

  <!-- ---------- settings sheet ---------- -->
  <div id="settings-backdrop" hidden></div>

  <div id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
    <div class="sheet-grip" aria-hidden="true"></div>

    <div class="sheet-head">
      <h2 id="settings-title">Controller</h2>
      <button id="close-settings" class="icon-btn" aria-label="Close settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3Z" />
        </svg>
      </button>
    </div>

    <!-- Populated from skins/skins.json so a dropped-in folder shows up here. -->
    <div class="layout-selector" id="skin-list"></div>

    <div class="sheet-section">
      <label class="toggle-row">
        <span>
          Vibration
          <small>Buzz on each button press</small>
        </span>
        <input type="checkbox" id="opt-haptics" checked>
        <span class="switch" aria-hidden="true"></span>
      </label>

      <label class="toggle-row">
        <span>
          Fullscreen
          <small>Hide the browser bars</small>
        </span>
        <input type="checkbox" id="opt-fullscreen" checked>
        <span class="switch" aria-hidden="true"></span>
      </label>
    </div>

    <button id="btn-disconnect" class="ghost-btn">Disconnect</button>
  </div>

  <div id="gamepad-container" hidden></div>

  <!-- Replaces alert(); alert() steals focus and drops touch state mid-game. -->
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>

</html>

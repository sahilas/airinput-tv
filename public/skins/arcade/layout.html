<div id="gamepad" class="layout-arcade">
  <div class="cab-top">
    <button class="pill-btn" data-btn="SELECT">SELECT</button>
    <button class="pill-btn" data-btn="START">START</button>
  </div>

  <div class="face">
    <!-- Left: a single large stick standing in for the cabinet lever. It reports
         the left analog axes, which emulators map to a d-pad happily. -->
    <div class="lever-well">
      <div id="stick-left-zone" class="stick-zone"></div>
    </div>

    <!-- Right: six big buttons in the classic 3-over-3 fight-stick arrangement.
         Top row is the "punch" row, bottom the "kick" row. -->
    <div class="button-cluster">
      <button class="arc-btn arc-1" data-btn="X">X</button>
      <button class="arc-btn arc-2" data-btn="Y">Y</button>
      <button class="arc-btn arc-3" data-btn="R">R</button>
      <button class="arc-btn arc-4" data-btn="A">A</button>
      <button class="arc-btn arc-5" data-btn="B">B</button>
      <button class="arc-btn arc-6" data-btn="L">L</button>
    </div>
  </div>
</div>
